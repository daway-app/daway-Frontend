name: Frontend CI
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run check:css
