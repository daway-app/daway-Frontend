<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دواك — الصيدلية</title>
    <!--
      PWA manifest — item #70. Arabic-first (dir/lang Arabic, RTL).
      `theme-color` matches the manifest's `theme_color`, which is the real
      token `--teal-primary` (#1C72A6) from styles/tokens.css, not an invented
      hex. Icons point only at files that actually exist in public/images/.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1C72A6" />
    <!--
      Font Awesome 6.7.2 — decision B8.
      Blade loads FA from this exact CDN URL (layouts/app.blade.php); no local
      FA assets exist in the backend, so the same CDN stylesheet is reused
      like-for-like rather than introducing a new dependency.
    -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <!--
      Chart.js 4 UMD — decision B7 (vendored, not an npm dependency).
      The Blade pages load the identical file with `defer`; Chart.tsx reads
      `window.Chart`. Without this tag the charts render empty canvases with no
      console error (audit B-1), so it MUST stay here.

      `defer` is required, not cosmetic: it guarantees Chart.js executes before
      the module script but after HTML parsing, which is the ordering the
      Chart.tsx mount path relies on.
    -->
    <script defer src="/vendor/chart.umd.js"></script>
    <!--
      Theme pre-paint — LIGHT ONLY (طلب عبود: بلا دارك مود).
      يضمن عدم وجود صنف `dark-mode` على <html> من أول رسم، ويمسح أي
      اختيار `theme` مخزن من نسخة قديمة فيرجع مستخدم الدارك السابق
      إلى الفاتح تلقائيًا. موسوم بـtry/catch لأن localStorage قد
      يرمي في سياقات التصفح الخاص.
    -->
    <script>
      (function () {
        document.documentElement.classList.remove('dark-mode');
        try {
          localStorage.removeItem('theme');
        } catch (e) {
          /* storage unavailable — nothing stored, nothing to clear */
        }
      })();
    </script>
    <!--
      Language pre-paint — same idea as the theme snippet above.
      `setLang()` sets html lang/dir at runtime, but on a fresh load the
      HTML is parsed with the static `lang="ar" dir="rtl"` first: an English
      user would see one RTL frame before React mounts. This snippet applies
      the stored choice synchronously before first paint. Default is Arabic
      (Blade parity) when nothing is stored.
    -->
    <script>
      (function () {
        var lang = null;
        try {
          lang = localStorage.getItem('daway.lang');
        } catch (e) {
          /* storage unavailable — fall through to the Arabic default */
        }
        if (lang !== 'ar' && lang !== 'en') lang = 'ar';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.title = lang === 'ar' ? 'دواك — الصيدلية' : 'Daway — Pharmacy';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
