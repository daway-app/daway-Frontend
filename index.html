<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دواك — الصيدلية</title>
    <!--
      PWA manifest — item #70. Arabic-first (dir/lang Arabic, RTL).
      `theme-color` matches the manifest's `theme_color`, which is the real
      token `--teal-primary` (#1C72A6) from styles/tokens.css, not an invented
      hex. Icons point only at files that actually exist in public/images/.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1C72A6" />
    <!-- The two login role icons are inline, so this stylesheet need not block
         their first paint. Other entry pages keep their normal CSS priority. -->
    <link id="font-awesome" rel="stylesheet" media="print"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      onload="this.media='all'" />
    <script>
      if (location.pathname !== '/login' && location.pathname !== '/') {
        document.getElementById('font-awesome').media = 'all';
      }
    </script>
    <link rel="preload" href="/fonts/tajawal-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/tajawal-700.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Theme pre-paint — LIGHT ONLY (طلب عبود: بلا دارك مود).
      يضمن عدم وجود صنف `dark-mode` على <html> من أول رسم، ويمسح أي
      اختيار `theme` مخزن من نسخة قديمة فيرجع مستخدم الدارك السابق
      إلى الفاتح تلقائيًا. موسوم بـtry/catch لأن localStorage قد
      يرمي في سياقات التصفح الخاص.
    -->
    <script>
      (function () {
        document.documentElement.classList.remove('dark-mode');
        try {
          localStorage.removeItem('theme');
        } catch (e) {
          /* storage unavailable — nothing stored, nothing to clear */
        }
      })();
    </script>
    <!--
      Language pre-paint — same idea as the theme snippet above.
      `setLang()` sets html lang/dir at runtime, but on a fresh load the
      HTML is parsed with the static `lang="ar" dir="rtl"` first: an English
      user would see one RTL frame before React mounts. This snippet applies
      the stored choice synchronously before first paint. Default is Arabic
      (Blade parity) when nothing is stored.
    -->
    <script>
      (function () {
        var lang = null;
        try {
          lang = localStorage.getItem('daway.lang');
        } catch (e) {
          /* storage unavailable — fall through to the Arabic default */
        }
        if (lang !== 'ar' && lang !== 'en') lang = 'ar';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
